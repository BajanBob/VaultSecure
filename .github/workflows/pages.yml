name: Publish website
# Puts the web version online with GitHub Pages every time you push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund --ignore-scripts qrcode-generator@1.4.4 jsqr@1.4.0 jszip@3.10.1
      - run: npm run vendor
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deployment
        uses: actions/deploy-pages@v4
